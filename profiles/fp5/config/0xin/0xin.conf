# Fairphone 5 standalone touch-test profile.
modifier = super
gap = 5
first_split = horizontal
background = 0.04 0.04 0.06

monitor = DSI-1, 0x0, 2.4

# Optional virtual-keyboard controller shared by key and gesture actions.
virtual_keyboard_show = pkill -USR2 -x wvkbd-mobintl
virtual_keyboard_hide = pkill -USR1 -x wvkbd-mobintl
# wvkbd's -H 300 buffer pixels / the output's 2.4 scale = 125 logical pixels.
virtual_keyboard_height = 125

# Physical touch triggers map to the same actions keyboard binds use.
gesture = bottom-up, keyboardshow
gesture = keyboard-top-down, keyboardhide
gesture = edge-left-in, workspaceprev
gesture = edge-right-in, workspacenext
