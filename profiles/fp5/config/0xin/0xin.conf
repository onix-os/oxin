# Fairphone 5 standalone touch-test profile.
modifier = super
gap = 5
first_split = horizontal
background = 0.04 0.04 0.06
wallpaper = ~/pics/286257.jpg
window_opacity = 0.8
# Real per-pixel corner masking (Stage 26). Re-enabled to retest after
# fixing a likely root cause (alpha-less textures read garbage from their
# sampled alpha channel on this GPU/driver) and adding real diagnostics
# (~/.local/state/0xin-touch-test.log). See
# docs/phases/stage-26-rounded-window-corners.md.
corner_radius = 40

monitor = DSI-1, 0x0, 3

# Session shell and clients. Each command starts once after 0xin's Wayland
# socket is ready; declaration order is preserved.
exec_once = ~/.local/bin/patin
exec_once = wvkbd-mobintl --hidden --no-popup -H 300 -L 200
exec_once = ~/.local/bin/0xin-auto-rotate

# Optional virtual-keyboard controller shared by key and gesture actions.
virtual_keyboard_show = pkill -USR2 -x wvkbd-mobintl
virtual_keyboard_hide = pkill -USR1 -x wvkbd-mobintl
# wvkbd's -H 300 buffer pixels / the output's 2.4 scale = 125 logical pixels.
virtual_keyboard_height = 125
# Keep the bottom gesture target but omit its training-wheel pill.
gesture_handle = hidden

# Physical touch triggers map to the same actions keyboard binds use.
gesture = bottom-up, keyboardshow
gesture = bottom-down, keyboardhide
gesture = edge-left-in, workspaceprev
gesture = edge-right-in, workspacenext
gesture = edge-left-up, spawn, pactl set-sink-volume @DEFAULT_SINK@ +5%
gesture = edge-left-down, spawn, pactl set-sink-volume @DEFAULT_SINK@ -5%
gesture = top-right, spawn, brightnessctl set +5%
gesture = top-left, spawn, brightnessctl set 5%-
gesture = top-down, spawn, pgrep -x patin-launcher >/dev/null || ~/.local/bin/patin-launcher

# Multi-finger window management, available across the central app surface.
gesture = two-up, movewindow, u
gesture = two-down, movewindow, d
gesture = two-left, movewindow, l
gesture = two-right, movewindow, r
gesture = three-up, close
gesture = three-down, close
gesture = three-left, movetoworkspaceprev
gesture = three-right, movetoworkspacenext
gesture = double-tap, solo

# Conventional hardware volume controls. These are standard xkb key names
# rather than FP5 event-device codes, so the mappings also work on other
# hardware that exposes conventional volume keys.
bind = , XF86AudioRaiseVolume, spawn, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, spawn, pactl set-sink-volume @DEFAULT_SINK@ -5%

# Release the power key before two seconds to start Patin's touch-capable
# session lock. Repeated short presses leave the existing locker alone.
bind = , XF86PowerOff, spawn, pgrep -x patin-lock >/dev/null || patin-lock
hold = , XF86PowerOff, 2000, spawn, ~/.local/bin/0xin-session-menu
