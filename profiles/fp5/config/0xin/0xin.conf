# Fairphone 5 standalone touch-test profile.
modifier = super
gap = 5
first_split = horizontal
background = 0.04 0.04 0.06

monitor = DSI-1, 0x0, 2.4

# Persistent bottom handle: swipe up to show wvkbd, down to hide it.
gesture_keyboard = wvkbd-mobintl
# wvkbd's -H 300 buffer pixels / the output's 2.4 scale = 125 logical pixels.
gesture_keyboard_height = 125

# Swipe inward from either side edge to cycle workspaces.
workspace_edge_swipe = true
